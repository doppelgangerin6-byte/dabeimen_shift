    <style>
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        select { -webkit-tap-highlight-color: transparent; }
        button { font: inherit; border: 0; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }

        /* v10：柔霧透明玻璃感 */
        .glass-card {
            -webkit-backdrop-filter: blur(18px) saturate(135%);
            backdrop-filter: blur(18px) saturate(135%);
            border: 1px solid rgba(255, 255, 255, 0.82);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.92);
        }
        .glass-card-morning {
            background: linear-gradient(145deg, rgba(255,255,255,.88), rgba(255,248,222,.58), rgba(255,255,255,.72));
        }
        .glass-card-mid {
            background: linear-gradient(145deg, rgba(255,255,255,.88), rgba(220,252,231,.48), rgba(255,255,255,.72));
        }
        .glass-card-evening {
            background: linear-gradient(145deg, rgba(255,255,255,.88), rgba(238,242,255,.52), rgba(255,255,255,.72));
        }
        .time-pill {
            -webkit-backdrop-filter: blur(12px) saturate(145%);
            backdrop-filter: blur(12px) saturate(145%);
            box-shadow: 0 5px 16px rgba(15, 23, 42, 0.07), inset 0 1px 0 rgba(255,255,255,.95);
        }
        .time-pill-morning { background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(255,237,179,.52)); border-color: rgba(245,158,11,.30); color: #B45309; }
        .time-pill-mid { background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(187,247,208,.48)); border-color: rgba(16,185,129,.26); color: #047857; }
        .time-pill-purple { background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(237,233,254,.68)); border-color: rgba(139,92,246,.28); color: #7C3AED; }
        .time-pill-red { background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(254,226,226,.66)); border-color: rgba(239,68,68,.28); color: #EF4444; }
        .time-pill-green { background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(209,250,229,.64)); border-color: rgba(16,185,129,.28); color: #059669; }
        .time-pill-blue { background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(219,234,254,.72)); border-color: rgba(59,130,246,.28); color: #2563EB; }
        .time-pill-late { background: linear-gradient(135deg, rgba(255,255,255,.94), rgba(226,232,240,.70)); border-color: rgba(100,116,139,.28); color: #334155; }
        .time-pill-gray { background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(229,231,235,.68)); border-color: rgba(107,114,128,.24); color: #4B5563; }


        /* v12：底部玻璃導覽列 */
        .bottom-nav-shell {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 100%;
            max-width: 28rem;
            padding: 9px 14px calc(9px + env(safe-area-inset-bottom));
            background: linear-gradient(180deg, rgba(255,255,255,.84), rgba(248,250,252,.94));
            -webkit-backdrop-filter: blur(24px) saturate(165%);
            backdrop-filter: blur(24px) saturate(165%);
            border-top: 1px solid rgba(255,255,255,.95);
            box-shadow: 0 -12px 34px rgba(15,23,42,.10), inset 0 1px 0 rgba(255,255,255,.96);
            z-index: 50;
        }
        .bottom-nav-inner {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }
        .nav-button {
            position: relative;
            min-width: 0;
            min-height: 58px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border-radius: 18px;
            color: #94A3B8;
            transition: transform .18s ease, color .18s ease, background .18s ease, box-shadow .18s ease;
        }
        .nav-button:active { transform: scale(.94); }
        .nav-icon-wrap {
            width: 38px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,.88);
            border-radius: 13px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 4px 12px rgba(15,23,42,.05);
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
        }
        .nav-button i { font-size: 17px; }
        .nav-label {
            font-size: 10px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: .04em;
            white-space: nowrap;
        }
        .nav-calendar .nav-icon-wrap {
            color: #3B82F6;
            background: linear-gradient(145deg, rgba(255,255,255,.94), rgba(219,234,254,.78));
        }
        .nav-daily .nav-icon-wrap {
            color: #D97706;
            background: linear-gradient(145deg, rgba(255,255,255,.94), rgba(254,243,199,.82));
        }
        .nav-leave .nav-icon-wrap {
            color: #8B5CF6;
            background: linear-gradient(145deg, rgba(255,255,255,.94), rgba(237,233,254,.82));
        }
        .nav-button.active {
            color: #172033;
            background: rgba(255,255,255,.72);
            box-shadow: 0 8px 22px rgba(15,23,42,.09), inset 0 1px 0 rgba(255,255,255,.96);
            transform: translateY(-2px);
        }
        .nav-button.active .nav-icon-wrap {
            transform: translateY(-2px) scale(1.08);
            box-shadow: 0 8px 18px rgba(15,23,42,.12), inset 0 1px 0 rgba(255,255,255,1);
        }
        .nav-button.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 18px;
            height: 3px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(245,193,68,.28), #F5C144, rgba(245,193,68,.28));
            box-shadow: 0 0 10px rgba(245,193,68,.34);
        }


        /* v17.6：療癒微動畫＋手機版面校正，保留診所系統的乾淨科技感 */
        @keyframes softFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes gentlePop { 0% { transform: scale(.94); opacity: .72; } 70% { transform: scale(1.035); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes cardRise { from { opacity: 0; transform: translateY(12px) scale(.985); filter: blur(2px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        @keyframes selectedBreath { 0%, 100% { box-shadow: 0 8px 18px rgba(15, 23, 42, .16); } 50% { box-shadow: 0 10px 24px rgba(245, 193, 68, .28); } }
        @keyframes todayNudge { 0%, 100% { transform: translateY(0); } 42% { transform: translateY(-2px) rotate(-1deg); } 68% { transform: translateY(0) rotate(1deg); } }
        @keyframes weatherSunny { 0%,100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(245,193,68,0)); } 50% { transform: scale(1.12) rotate(6deg); filter: drop-shadow(0 0 10px rgba(245,193,68,.38)); } }
        @keyframes weatherRain { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
        @keyframes weatherCloud { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
        @keyframes weatherBolt { 0%, 55%, 100% { transform: scale(1); filter: brightness(1); } 12% { transform: scale(1.18) rotate(-7deg); filter: brightness(1.45); } 24% { transform: scale(.98) rotate(5deg); filter: brightness(1); } }
        @keyframes shimmerLine { from { transform: translateX(-140%); } to { transform: translateX(140%); } }
        @keyframes navIconWink { 0% { transform: translateY(-2px) scale(1.02); } 45% { transform: translateY(-5px) scale(1.16) rotate(-4deg); } 100% { transform: translateY(-2px) scale(1.08); } }
        @keyframes holidayBob { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-6px) rotate(-2deg); } }
        @keyframes tinySparkle { 0%, 100% { opacity: .28; transform: scale(.8) translateY(0); } 50% { opacity: .85; transform: scale(1.06) translateY(-3px); } }

        .app-shell::before {
            content: '';
            position: absolute;
            inset: -90px -80px auto -80px;
            height: 230px;
            pointer-events: none;
            background:
                radial-gradient(circle at 22% 28%, rgba(125, 211, 252, .28), transparent 33%),
                radial-gradient(circle at 72% 18%, rgba(196, 181, 253, .24), transparent 34%),
                radial-gradient(circle at 54% 82%, rgba(253, 230, 138, .26), transparent 36%);
            filter: blur(18px);
            opacity: .78;
            z-index: 0;
            animation: softFloat 7s ease-in-out infinite;
        }
        .app-shell > :not(.bottom-nav-shell) { position: relative; }

        #weather-widget {
            position: relative;
            overflow: hidden;
        }
        #weather-widget::after,
        #weather-advice::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 46%;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.68), transparent);
            transform: translateX(-140%);
            animation: shimmerLine 5.2s ease-in-out infinite;
        }
        #weather-advice {
            position: relative;
            overflow: hidden;
        }
        .weather-emoji {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transform-origin: center;
        }
        .weather-emoji.sunny { animation: weatherSunny 2.8s ease-in-out infinite; }
        .weather-emoji.rainy { animation: weatherRain 1.25s ease-in-out infinite; }
        .weather-emoji.cloudy { animation: weatherCloud 2.4s ease-in-out infinite; }
        .weather-emoji.thunder { animation: weatherBolt 1.8s ease-in-out infinite; }
        .weather-emoji.foggy { animation: softFloat 2.8s ease-in-out infinite; }
        .advice-icon-pop { animation: gentlePop .45s ease-out both, softFloat 3.4s ease-in-out .6s infinite; }
        .today-nudge:not(:disabled) { animation: todayNudge 2.6s ease-in-out infinite; }

        .reveal-pop {
            opacity: 0;
            animation: cardRise .42s cubic-bezier(.2,.75,.24,1) forwards;
        }
        .staff-row, .summary-card, .calendar-detail-card, .calendar-day-cell {
            will-change: transform, opacity;
        }
        .staff-row {
            border-radius: 14px;
            transition: background .18s ease, transform .18s ease;
        }
        .staff-row:active { transform: scale(.985); background: rgba(248,250,252,.72); }
        #daily-shift-cards > .glass-card {
            position: relative;
            overflow: hidden;
        }
        #daily-shift-cards > .glass-card::after {
            content: '✦';
            position: absolute;
            right: 18px;
            top: 12px;
            font-size: 12px;
            color: rgba(245, 193, 68, .72);
            animation: tinySparkle 2.8s ease-in-out infinite;
        }
        #date-slider > div {
            will-change: transform;
        }
        #date-slider > div.shadow-md {
            animation: selectedBreath 2.8s ease-in-out infinite;
        }
        .nav-button.active .nav-icon-wrap {
            animation: navIconWink .42s cubic-bezier(.2,.75,.24,1) both;
        }
        .summary-card {
            position: relative;
            overflow: hidden;
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .summary-card::before {
            content: '✦';
            position: absolute;
            right: 18px;
            top: 17px;
            color: rgba(139, 92, 246, .26);
            font-size: 18px;
            animation: tinySparkle 3.4s ease-in-out infinite;
        }
        .summary-card:active { transform: scale(.99); }
        .holiday-mascot { display: inline-block; animation: holidayBob 2.7s ease-in-out infinite; }


        /* v17.6：手機版面安全校正，避免預覽／手機小螢幕被切到 */
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
        }
        *, *::before, *::after { box-sizing: border-box; }
        .app-shell {
            width: min(100vw, 28rem);
            max-width: 28rem;
            margin-left: auto;
            margin-right: auto;
            overflow-x: hidden;
            overflow-x: clip;
        }
        .top-shell {
            padding-left: max(1rem, env(safe-area-inset-left));
            padding-right: max(1rem, env(safe-area-inset-right));
        }
        .top-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: .75rem;
        }
        .brand-title { min-width: 0; letter-spacing: -.03em; }
        .brand-title .brand-main {
            display: block;
            font-size: 1.08rem;
            line-height: 1.05;
        }
        .brand-title .brand-tech {
            display: block;
            font-size: 1.62rem;
            line-height: 1.06;
        }
        .month-picker select, #global-month { max-width: 8.85rem; }
        .weather-center { margin-top: .65rem; }
        #weather-widget {
            width: min(100%, 19rem);
            max-width: 19rem;
            min-height: 2.55rem;
            border-radius: 1rem;
            white-space: nowrap;
        }
        #weather-widget span { min-width: 0; }
        #weather-advice {
            margin-top: .65rem;
            border-radius: 1.1rem;
            padding: .62rem .78rem;
            gap: .62rem;
        }
        #weather-advice-icon {
            width: 1.85rem;
            height: 1.85rem;
            border-radius: .75rem;
        }
        #weather-advice-text {
            font-size: .72rem;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        #page-daily, #page-calendar, #page-summary {
            padding-left: 1rem;
            padding-right: 1rem;
        }
        #daily-title-date { overflow-wrap: anywhere; }
        #go-today-button { padding-left: .72rem; padding-right: .72rem; }
        .bottom-nav-shell {
            width: min(100vw, 28rem);
            max-width: 28rem;
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
        }
        @media (max-width: 390px) {
            .top-shell { padding-left: .88rem; padding-right: .88rem; }
            .brand-title .brand-main { font-size: .96rem; }
            .brand-title .brand-tech { font-size: 1.44rem; }
            #global-month {
                font-size: .78rem;
                padding-left: .72rem;
                padding-right: 1.75rem;
            }
            #weather-widget {
                max-width: 100%;
                padding-left: .85rem;
                padding-right: .85rem;
            }
            #weather-advice { padding: .58rem .7rem; }
            #weather-advice-text { font-size: .68rem; }
            #page-daily, #page-calendar, #page-summary {
                padding-left: .88rem;
                padding-right: .88rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }

    </style>
</head>
<body class="bg-[#F4F6F8] flex justify-center min-h-screen">

    <div class="app-shell w-full max-w-md bg-[#F4F6F8] shadow-xl flex flex-col relative pb-28 min-h-screen overflow-hidden">
        
        <!-- ================= 全域頂部導覽列 ================= -->
        <div class="top-shell px-5 pt-5 pb-2 sticky top-0 z-40 bg-[#F4F6F8]">
            <div class="top-row flex justify-between items-center gap-3">
                <h1 class="brand-title min-w-0 font-black leading-tight text-[#1A1D20]" aria-label="大北門讚 SmartShift">
                    <span class="brand-main">大北門讚</span>
                    <span class="brand-tech whitespace-nowrap">SmartShift</span>
                </h1>
                <div class="month-picker relative shrink-0 active:scale-95 transition-transform duration-100">
                    <select id="global-month" onchange="switchMonth(this.value)" class="appearance-none bg-[#1A1D20] text-[#F5C144] border-none text-sm font-bold py-1.5 pl-3 pr-8 rounded-lg shadow-sm focus:outline-none cursor-pointer tracking-wider">
                        <option value="8">8月 班表</option>
                        <option value="7">7月 班表</option>
                        <option value="6">6月 班表</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-[#F5C144] text-xs pointer-events-none"></i>
                </div>
            </div>

            <!-- 氣象小工具：獨立置中，保留完整地區名稱 -->
            <div class="weather-center mt-3 flex justify-center">
                <div id="weather-widget" class="flex w-full max-w-[300px] items-center justify-center gap-2 overflow-hidden bg-white border border-[#E2E8F0] text-gray-600 px-4 py-2 rounded-2xl text-sm font-bold shadow-sm transition-all duration-300" title="診所所在地即時天氣">
                    <i class="fa-solid fa-spinner fa-spin text-gray-400"></i>
                    <span class="text-xs truncate">讀取天氣</span>
                </div>
            </div>

            <!-- 今日上班穿搭／通勤提醒 -->
            <div id="weather-advice" class="mt-3 flex items-start gap-2.5 rounded-2xl border border-sky-100 bg-gradient-to-r from-white via-sky-50/80 to-indigo-50/70 px-3.5 py-3 shadow-sm transition-all duration-300" aria-live="polite">
                <div id="weather-advice-icon" class="advice-icon-pop w-8 h-8 rounded-xl bg-white border border-sky-100 shadow-sm flex items-center justify-center text-sky-500 shrink-0">
                    <i class="fa-solid fa-shirt"></i>
                </div>
                <div class="min-w-0">
                    <p class="text-[10px] font-black tracking-[0.12em] text-sky-500">今日上班穿搭</p>
                    <p id="weather-advice-text" class="mt-0.5 text-xs font-bold leading-relaxed text-[#334155]">正在依照所在地天氣整理通勤建議…</p>
                </div>
            </div>
        </div>

        <!-- ================= 頁面 1：單日排班 ================= -->
        <div id="page-daily" class="flex flex-col flex-1 p-5 pt-2">
            <div class="flex justify-between items-center gap-3 mb-4">
                <p id="daily-title-date" class="text-lg font-bold text-[#1A1D20] min-w-0">-</p>
                <div class="flex items-center gap-2 shrink-0">
                    <span class="hidden sm:inline-flex text-xs font-bold bg-white text-gray-500 px-2 py-1 rounded shadow-sm">單日檢視</span>
                    <button type="button" id="go-today-button" onclick="goToToday()" class="inline-flex items-center gap-1.5 rounded-xl border border-amber-200 bg-gradient-to-r from-white to-amber-50 px-3 py-2 text-xs font-black text-amber-700 shadow-sm transition active:scale-95 disabled:cursor-default disabled:opacity-60" aria-label="回到今天日期">
                        <i class="fa-solid fa-location-crosshairs"></i>
                        <span id="go-today-label">回到今天</span>
                    </button>
                </div>
            </div>
            
            <div id="date-slider" class="flex gap-2.5 overflow-x-auto no-scrollbar py-2"></div>
            
            <h2 class="text-sm font-bold text-gray-700 mt-5 mb-2"><i class="fa-regular fa-clipboard mr-1.5"></i>當日出勤名單</h2>
            
            <div class="flex-1 overflow-y-auto no-scrollbar">
                <div id="public-holiday-card" class="hidden bg-gradient-to-br from-rose-50 via-white to-amber-50 border border-rose-100 rounded-3xl p-6 shadow-sm text-center animate-fade-in">
                    <div class="holiday-mascot text-5xl mb-3">🐣</div>
                    <p class="text-xl font-black text-[#1A1D20]">星期日公休</p>
                    <p class="text-sm font-bold text-rose-400 mt-1">今天安心充電，明天再一起開工 ✨</p>
                    <div class="mt-4 inline-flex items-center gap-2 bg-white/90 border border-rose-100 text-rose-500 px-3 py-1.5 rounded-full text-xs font-black shadow-sm">
                        <i class="fa-solid fa-mug-hot"></i>
                        <span>休息中</span>
                    </div>
                </div>

                <div id="daily-shift-cards" class="flex flex-col gap-4">
                    <div class="glass-card glass-card-morning rounded-2xl p-4">
                        <div class="flex justify-between items-center mb-3 gap-2">
                            <span id="morning-shift-title" class="text-sm font-bold text-[#1A1D20]">☀️ 早班同仁</span>
                            <span id="morning-status-tag" class="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-500 shrink-0">-</span>
                        </div>
                        <hr class="border-[#EDF2F7] mb-2">
                        <div id="morning-staff-list" class="flex flex-col gap-2"></div>
                    </div>

                    <div id="mid-shift-card" class="glass-card glass-card-mid rounded-2xl p-4 hidden">
                        <div class="flex justify-between items-center mb-3 gap-2">
                            <span id="mid-shift-title" class="text-sm font-bold text-[#1A1D20]">🍵 午班同仁 (13:30 - 17:00)</span>
                            <span id="mid-status-tag" class="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-500 shrink-0">-</span>
                        </div>
                        <hr class="border-[#EDF2F7] mb-2">
                        <div id="mid-staff-list" class="flex flex-col gap-2"></div>
                    </div>

        function getWeekdayIndex(month, day) {
            const startIdx = startWeekdays[month] || 0;
            return (startIdx + day - 1) % 7; // 0=一 ... 5=六, 6=日
        }

        function isSaturday(month, day) {
            return getWeekdayIndex(month, day) === 5;
        }

        function isSunday(month, day) {
            return getWeekdayIndex(month, day) === 6;
        }

        function getMorningShiftHours(month, day) {
            return isSaturday(month, day) ? "08:30 - 12:30" : "08:30 - 12:00";
        }

        function getDefaultEveningMeta(rawHours) {
            const raw = String(rawHours ?? "").trim();
            if (raw.includes("14:30")) return { hours: "14:30 - 19:30", tone: "red" };
            const number = Number.parseFloat(raw);
            if (number === 2 || number === 2.5) return { hours: "15:00 - 17:00", tone: "purple" };
            if (number === 4.5) return { hours: "15:00 - 19:30", tone: "green" };
            if (number === 4) return { hours: "15:00 - 19:00", tone: "blue" };
            return { hours: "15:00 - 20:00", tone: "black" };
        }

        function ensureShiftPerson(month, day, shiftName, person) {
            const shift = appData[month]?.shifts?.[day]?.[shiftName];
            if (!shift) return;
            const existing = shift.find(item => item.name === person.name);
            if (existing) Object.assign(existing, person);
            else shift.push(person);
        }

        function prepareAppData() {
            Object.entries(appData).forEach(([monthKey, monthData]) => {
                const month = Number(monthKey);
                for (let day = 1; day <= monthData.days; day++) {
                    const shift = monthData.shifts[day];
                    if (!shift) continue;
                    shift["早班"] = shift["早班"] || [];
                    shift["午班"] = shift["午班"] || [];
                    shift["晚班"] = shift["晚班"] || [];

                    shift["早班"].forEach(person => {
                        person.hours = getMorningShiftHours(month, day);
                        person.tone = "morning";
                    });
                    shift["午班"].forEach(person => {
                        person.hours = "13:30 - 17:00";
                        person.tone = "mid";
                    });
                    shift["晚班"].forEach(person => {
                        const excelMeta = eveningShiftMeta[month]?.[day]?.[person.name];
                        Object.assign(person, excelMeta || getDefaultEveningMeta(person.hours));
                    });
                }
            });

            // Excel 藍底：休假日出勤（空白格仍需列入班表）
            ensureShiftPerson(7, 17, "早班", {
                name: "宜臻",
                hours: getMorningShiftHours(7, 17),
                tone: "morning",
                holidayWork: true
            });
            ensureShiftPerson(7, 18, "早班", {
                name: "瑋琳",
                hours: getMorningShiftHours(7, 18),
                tone: "morning",
                holidayWork: true
            });

            // 7/24 羿寧：灰底晚班，並標註大東門支援
            ensureShiftPerson(7, 24, "晚班", {
                name: "羿寧",
                hours: "14:30 - 19:30",
                tone: "gray",
                support: "大東門支援"
            });

            // 同仁統計同步 Excel：藍底出勤時數與休假日出勤標記
            const julyStats = appData[7]?.stats || [];
            const yiZhen = julyStats.find(emp => emp.name === "宜臻");
            if (yiZhen) {
                yiZhen.totalHours = 121;
                yiZhen.fullLeaves = (yiZhen.fullLeaves || []).filter(day => day !== 17);
                yiZhen.holidayWorkDays = [17];
            }
            const weiLin = julyStats.find(emp => emp.name === "瑋琳");
            if (weiLin) {
                weiLin.totalHours = 182;
                weiLin.fullLeaves = (weiLin.fullLeaves || []).filter(day => day !== 18);
                weiLin.holidayWorkDays = [18];
            }
        }

        prepareAppData();

        const systemDate = new Date();
        const realMonth = systemDate.getMonth() + 1;
        const realDay = systemDate.getDate();

        let currentMonth = appData[realMonth] ? realMonth : Math.max(...Object.keys(appData).map(Number));
        let currentSelectedDay = realDay;

        if (currentSelectedDay > appData[currentMonth].days) {
            currentSelectedDay = appData[currentMonth].days;
        }

        let calendarSelectedDay = currentSelectedDay;
        let currentEmployeeFilter = 'all';
        let dayInitiated = false;

        function getWeekdayString(month, day) {
            const list = ["一", "二", "三", "四", "五", "六", "日"];
            return `(${list[getWeekdayIndex(month, day)]})`;
        }

        function getShiftData(month, day) {
            if (appData[month] && appData[month].shifts && appData[month].shifts[day]) {
                const sd = appData[month].shifts[day];
                return {
                    "早班": sd["早班"] || [],
                    "午班": sd["午班"] || [],
                    "晚班": sd["晚班"] || []
                };
            }
            return { "早班": [], "午班": [], "晚班": [] };
        }

        function updateSmartStatus(day) {
            const morningTag = document.getElementById("morning-status-tag");
            const midTag = document.getElementById("mid-status-tag");
            const eveningTag = document.getElementById("evening-status-tag");
            if (!morningTag || !midTag || !eveningTag) return;

            if (isSunday(currentMonth, day)) {
                [morningTag, midTag, eveningTag].forEach(tag => setTag(tag, "💤 公休中", "bg-rose-50 text-rose-500"));
                return;
            }

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const selected = new Date(scheduleYear, currentMonth - 1, day).getTime();
            const shiftData = getShiftData(currentMonth, day);

            if (selected < today) {
                [morningTag, midTag, eveningTag].forEach(tag => setTag(tag, "⚪ 已下班", "bg-gray-100 text-gray-500"));
                return;
            }
            if (selected > today) {
                [morningTag, midTag, eveningTag].forEach(tag => setTag(tag, "🌙 預備中", "bg-orange-50 text-orange-500"));
                return;
            }

            setStatusByShift(morningTag, shiftData["早班"], getMorningShiftHours(currentMonth, day));
            setStatusByShift(midTag, shiftData["午班"], "13:30 - 17:00");
            setStatusByShift(eveningTag, shiftData["晚班"]);
        }

        function setStatusByShift(tag, people, fixedRange = null) {
            if (!people || people.length === 0) {
                setTag(tag, "— 無排班", "bg-gray-50 text-gray-400");
                return;
            }

            const ranges = fixedRange ? [fixedRange] : people.map(person => person.hours).filter(Boolean);
            const starts = ranges.map(range => timeToMinutes(range.split("-")[0])).filter(Number.isFinite);
            const ends = ranges.map(range => timeToMinutes(range.split("-")[1])).filter(Number.isFinite);
            if (!starts.length || !ends.length) {
                setTag(tag, "🌙 預備中", "bg-orange-50 text-orange-500");
                return;
            }

            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const start = Math.min(...starts);
            const end = Math.max(...ends);
            if (currentMinutes < start) setTag(tag, "🌙 預備中", "bg-orange-50 text-orange-500");
            else if (currentMinutes < end) setTag(tag, "🟢 上班中", "bg-green-50 text-green-600");
            else setTag(tag, "⚪ 已下班", "bg-gray-100 text-gray-500");
        }

        function timeToMinutes(value) {
            const match = String(value || "").trim().match(/(\d{1,2}):(\d{2})/);
            return match ? Number(match[1]) * 60 + Number(match[2]) : NaN;
        }

        function setTag(el, text, className) {
            el.innerText = text;
            el.className = `text-[10px] font-bold px-2 py-0.5 rounded ${className}`;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function getToneStyle(tone) {
            const styles = {
                purple: { dot: "bg-violet-500", badge: "time-pill-purple" },
                red: { dot: "bg-red-500", badge: "time-pill-red" },
                black: { dot: "bg-slate-500", badge: "time-pill-late" },
                green: { dot: "bg-emerald-500", badge: "time-pill-green" },
                blue: { dot: "bg-blue-500", badge: "time-pill-blue" },
                gray: { dot: "bg-gray-400", badge: "time-pill-gray" },
                morning: { dot: "bg-amber-400", badge: "time-pill-morning" },
                mid: { dot: "bg-emerald-400", badge: "time-pill-mid" }
            };
            return styles[tone] || styles.black;
        }

        function renderStaffRow(person, shiftType) {
            const tone = shiftType === "晚班" ? person.tone : (shiftType === "午班" ? "mid" : "morning");
            const style = getToneStyle(tone);
            const holidayBadge = person.holidayWork
                ? `<span class="ml-1.5 inline-flex items-center rounded-full bg-sky-50/80 border border-sky-200 text-sky-600 px-1.5 py-0.5 text-[9px] font-black">休假日出勤</span>`
                : "";
            const supportBadge = person.support
                ? `<span class="ml-1.5 inline-flex items-center gap-1 rounded-full bg-cyan-50/80 border border-cyan-200 text-cyan-700 px-1.5 py-0.5 text-[9px] font-black whitespace-nowrap"><i class="fa-solid fa-location-dot text-[8px]"></i>${escapeHtml(person.support)}</span>`
                : "";

            return `
                <div class="staff-row reveal-pop flex items-center justify-between gap-3 text-sm min-h-[30px] px-1 py-0.5">
                    <div class="flex items-center min-w-0 flex-wrap gap-y-1">
                        <span class="w-2 h-2 rounded-full ${style.dot} mr-2 shrink-0"></span>
                        <span class="font-bold text-[#2D3748] shrink-0">${escapeHtml(person.name)}</span>
                        ${holidayBadge}
                        ${supportBadge}
                    </div>
                    <span class="time-pill text-[11px] font-black border rounded-xl px-2.5 py-1.5 whitespace-nowrap ${style.badge}">${escapeHtml(person.hours)}</span>
                </div>`;
        }

        function renderDetailPerson(person, shiftType) {
            const tone = shiftType === "晚班" ? person.tone : (shiftType === "午班" ? "mid" : "morning");
            const style = getToneStyle(tone);
            const holidayBadge = person.holidayWork
                ? `<span class="text-[8px] font-black text-sky-600 bg-sky-50/80 border border-sky-200 rounded px-1 py-0.5">休假出勤</span>`
                : "";
            const supportBadge = person.support
                ? `<span class="text-[8px] font-black text-cyan-700 bg-cyan-50/80 border border-cyan-200 rounded px-1 py-0.5 whitespace-nowrap">${escapeHtml(person.support)}</span>`
                : "";
            return `<div class="flex items-center justify-between gap-1.5 py-0.5">
                <span class="text-xs font-bold text-[#2D3748] flex items-center gap-1 min-w-0 flex-wrap"><span class="w-1.5 h-1.5 rounded-full ${style.dot} shrink-0"></span>${escapeHtml(person.name)} ${holidayBadge} ${supportBadge}</span>
                <span class="time-pill text-[9px] font-black border rounded-lg px-1.5 py-1 whitespace-nowrap ${style.badge}">${escapeHtml(person.hours)}</span>
            </div>`;
        }


        function initEmployeeFilter() {
            const filterSelect = document.getElementById("employee-filter");
            filterSelect.innerHTML = '<option value="all">所有人員</option>';
            const names = new Set();
            if (appData[currentMonth] && appData[currentMonth].stats) {
                appData[currentMonth].stats.forEach(emp => names.add(emp.name));
            }
            names.forEach(name => {
                filterSelect.innerHTML += `<option value="${name}">${name}</option>`;
            });
            filterSelect.value = currentEmployeeFilter;
        }

        function switchMonth(month) {
            if (navigator.vibrate) navigator.vibrate(30);

            currentMonth = parseInt(month);
            currentEmployeeFilter = 'all';
            dayInitiated = false; 

            if (currentSelectedDay > appData[currentMonth].days) currentSelectedDay = 1;
            if (calendarSelectedDay > appData[currentMonth].days) calendarSelectedDay = 1;

            document.getElementById("calendar-title-month").innerText = `${currentMonth}月 班表日曆`;
            document.getElementById("summary-title-month").innerText = `${currentMonth}月 休假總覽`;

            initEmployeeFilter();
            renderDailyPage(currentSelectedDay);
            renderCalendarPage();
            renderSummaryPage();
        }

        function filterEmployee(empName) {
            if (navigator.vibrate) navigator.vibrate(30);
            currentEmployeeFilter = empName;
            renderCalendarPage();
        }

        function goToToday() {
            if (navigator.vibrate) navigator.vibrate(30);

            const today = new Date();
            const todayYear = today.getFullYear();
            const todayMonth = today.getMonth() + 1;
            const todayDay = today.getDate();

            if (todayYear !== scheduleYear || !appData[todayMonth]) {
                alert(`目前班表尚未提供 ${todayYear} 年 ${todayMonth} 月資料`);
                return;
            }

            currentMonth = todayMonth;
            currentSelectedDay = Math.min(todayDay, appData[currentMonth].days);
            calendarSelectedDay = currentSelectedDay;
            currentEmployeeFilter = 'all';
            dayInitiated = false;

            const monthSelect = document.getElementById("global-month");
            if (monthSelect) monthSelect.value = String(currentMonth);

            document.getElementById("calendar-title-month").innerText = `${currentMonth}月 班表日曆`;
            document.getElementById("summary-title-month").innerText = `${currentMonth}月 休假總覽`;

            initEmployeeFilter();
            renderDailyPage(currentSelectedDay);
            renderCalendarPage();
            renderSummaryPage();
        }

        function updateTodayButton(day) {
            const button = document.getElementById("go-today-button");
            const label = document.getElementById("go-today-label");
            if (!button || !label) return;

            const today = new Date();
            const isToday = today.getFullYear() === scheduleYear
                && currentMonth === today.getMonth() + 1
                && day === today.getDate();

            button.disabled = isToday;
            label.textContent = isToday ? "今天" : "回到今天";
            button.classList.toggle("ring-2", isToday);
            button.classList.toggle("ring-amber-100", isToday);
            button.classList.toggle("today-nudge", !isToday);
        }


        function applyStaggerAnimation(selector, baseDelay = 30) {
            const items = document.querySelectorAll(selector);
            items.forEach((item, index) => {
                item.style.animationDelay = `${Math.min(index * baseDelay, 420)}ms`;
            });
        }

        function weatherAnimationClass(code) {
            if (code === 0) return "sunny";
            if (code >= 95) return "thunder";
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "rainy";
            if (code >= 45 && code <= 48) return "foggy";
            return "cloudy";
        }

        function renderDailyPage(day) {
            currentSelectedDay = day;
            document.getElementById("daily-title-date").innerText = `${currentMonth}月${day}日 ${getWeekdayString(currentMonth, day)}`;
            updateTodayButton(day);

            const slider = document.getElementById("date-slider");
            slider.innerHTML = "";
            const daysInMonth = appData[currentMonth].days;

            for (let i = 1; i <= daysInMonth; i++) {
                const isSelected = i === day;
                const sunday = isSunday(currentMonth, i);
                const div = document.createElement("div");
                const normalStyle = sunday
                    ? "bg-rose-50 border-rose-100 text-rose-500"
                    : "bg-white border-[#E2E8F0] text-[#2D3748]";
                const selectedStyle = sunday
                    ? "bg-rose-500 border-rose-500 text-white shadow-md"
                    : "bg-[#1A1D20] border-[#1A1D20] text-white shadow-md";
                div.className = `flex flex-col items-center justify-center min-w-[55px] h-[55px] rounded-xl border cursor-pointer transition-transform duration-100 active:scale-90 ${isSelected ? selectedStyle : normalStyle}`;

                div.onclick = () => {
                    if (navigator.vibrate) navigator.vibrate(30);
                    renderDailyPage(i);
                };

                const dayColor = isSelected ? (sunday ? "text-white" : "text-[#F5C144]") : "";
                const weekdayColor = isSelected ? "text-white/75" : (sunday ? "text-rose-400" : "text-gray-400");
                div.innerHTML = `<span class="text-base font-bold ${dayColor}">${i}</span><span class="text-[9px] ${weekdayColor} font-bold">${getWeekdayString(currentMonth, i)}</span>`;
                slider.appendChild(div);

                if (isSelected && !dayInitiated) {
                    setTimeout(() => div.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" }), 150);
                }
            }
            dayInitiated = true;

            const holidayCard = document.getElementById("public-holiday-card");
            const shiftCards = document.getElementById("daily-shift-cards");
            if (isSunday(currentMonth, day)) {
                holidayCard.classList.remove("hidden");
                shiftCards.classList.add("hidden");
                updateSmartStatus(day);
                applyStaggerAnimation("#public-holiday-card .holiday-mascot", 0);
                return;
            }
            holidayCard.classList.add("hidden");
            shiftCards.classList.remove("hidden");

            const morningTitle = document.getElementById("morning-shift-title");
            const midTitle = document.getElementById("mid-shift-title");
            morningTitle.innerText = `☀️ 早班同仁 (${getMorningShiftHours(currentMonth, day)})`;
            midTitle.innerText = "🍵 午班同仁 (13:30 - 17:00)";

            const morningList = document.getElementById("morning-staff-list");
            const midCard = document.getElementById("mid-shift-card");
            const midList = document.getElementById("mid-staff-list");
            const eveningList = document.getElementById("evening-staff-list");
            morningList.innerHTML = "";
            midList.innerHTML = "";
            eveningList.innerHTML = "";

            const shiftData = getShiftData(currentMonth, day);
            const morningData = shiftData["早班"];
            const midData = shiftData["午班"];
            const eveningData = shiftData["晚班"];

            morningList.innerHTML = morningData.length
                ? morningData.map(person => renderStaffRow(person, "早班")).join("")
                : `<p class="text-xs text-gray-400 py-1">今日無早班排班</p>`;

            if (midData.length > 0) {
                midCard.classList.remove("hidden");
                midList.innerHTML = midData.map(person => renderStaffRow(person, "午班")).join("");
            } else {
                midCard.classList.add("hidden");
            }

            eveningList.innerHTML = eveningData.length
                ? eveningData.map(person => renderStaffRow(person, "晚班")).join("")
                : `<p class="text-xs text-gray-400 py-1">今日無晚班排班</p>`;

            updateSmartStatus(day);
            applyStaggerAnimation(".staff-row", 42);
        }

        function renderCalendarPage() {
            const grid = document.getElementById("calendar-grid");
            grid.innerHTML = "";

            const startIdx = startWeekdays[currentMonth] || 0;
            for (let i = 0; i < startIdx; i++) grid.innerHTML += `<div></div>`;

            const daysInMonth = appData[currentMonth].days;
            for (let i = 1; i <= daysInMonth; i++) {
                const shiftData = getShiftData(currentMonth, i);
                const isSelected = i === calendarSelectedDay;
                const sunday = isSunday(currentMonth, i);

                let hasEarly = false;
                let hasMid = false;
                let hasLate = false;
                if (currentEmployeeFilter === "all") {
                    hasEarly = shiftData["早班"].length > 0;
                    hasMid = shiftData["午班"].length > 0;
                    hasLate = shiftData["晚班"].length > 0;
                } else {
                    hasEarly = shiftData["早班"].some(employee => employee.name === currentEmployeeFilter);
                    hasMid = shiftData["午班"].some(employee => employee.name === currentEmployeeFilter);
                    hasLate = shiftData["晚班"].some(employee => employee.name === currentEmployeeFilter);
                }

                const isFilteredWorking = currentEmployeeFilter !== "all" && (hasEarly || hasMid || hasLate);
                let styleClass;
                if (isSelected) {
                    styleClass = sunday
                        ? "border-rose-500 bg-rose-500 text-white shadow-md"
                        : "border-[#1A1D20] bg-[#1A1D20] text-white shadow-md";
                } else if (sunday) {
                    styleClass = "border-rose-100 bg-rose-50 text-rose-500";
                } else if (isFilteredWorking) {
                    styleClass = "border-amber-400 bg-amber-50 text-[#2D3748]";
                } else {
                    styleClass = "border-transparent bg-gray-50 text-[#2D3748] hover:border-gray-200";
                }

                const indicators = sunday
                    ? `<span class="text-[8px] font-black mt-0.5 ${isSelected ? "text-white/80" : "text-rose-400"}">公休</span>`
                    : `<div class="flex gap-0.5 mt-0.5 px-0.5 flex-wrap justify-center w-full">
                        ${hasEarly ? `<span class="w-1 h-1 md:w-1.5 md:h-1.5 rounded-full ${isFilteredWorking ? "bg-amber-500" : "bg-amber-400"}"></span>` : ""}
                        ${hasMid ? `<span class="w-1 h-1 md:w-1.5 md:h-1.5 rounded-full ${isFilteredWorking ? "bg-emerald-500" : "bg-emerald-400"}"></span>` : ""}
                        ${hasLate ? `<span class="w-1 h-1 md:w-1.5 md:h-1.5 rounded-full ${isFilteredWorking ? "bg-indigo-500" : "bg-indigo-400"}"></span>` : ""}
                    </div>`;

                grid.innerHTML += `
                    <div onclick="selectCalendarDay(${i})" class="calendar-day-cell reveal-pop cursor-pointer aspect-square flex flex-col items-center justify-center rounded-xl border-2 ${styleClass} transition-transform duration-100 active:scale-90">
                        <span class="text-sm font-bold">${i}</span>
                        ${indicators}
                    </div>`;
            }
            applyStaggerAnimation("#calendar-grid .calendar-day-cell", 12);
            updateCalendarDetail(calendarSelectedDay);
        }

        function selectCalendarDay(day) {
            calendarSelectedDay = day;
            currentSelectedDay = day; 
            renderCalendarPage();
            
            if (navigator.vibrate) navigator.vibrate(30);
            
            setTimeout(() => {
                const detailCard = document.getElementById("calendar-detail-card");
                if (detailCard) {
                    const innerCard = detailCard.firstElementChild;
                    if(innerCard) {
                        innerCard.classList.remove("animate-fade-in");
                        void innerCard.offsetWidth; 
                        innerCard.classList.add("animate-fade-in");
                    }
                    detailCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 50);
        }

        function updateCalendarDetail(day) {
            const detailContainer = document.getElementById("calendar-detail-card");

            if (isSunday(currentMonth, day)) {
                detailContainer.innerHTML = `
                    <div class="calendar-detail-card bg-gradient-to-br from-rose-50 via-white to-amber-50 rounded-2xl border border-rose-100 p-5 shadow-sm text-center animate-fade-in">
                        <div class="holiday-mascot text-4xl mb-2">🌼</div>
                        <p class="text-base font-black text-[#1A1D20]">${currentMonth}月${day}日・星期日公休</p>
                        <p class="text-xs font-bold text-rose-400 mt-1">今天沒有排班，大家好好休息～</p>
                    </div>`;
                return;
            }

            const shiftData = getShiftData(currentMonth, day);
            let titleText = `${currentMonth}月${day}日 出勤名單`;
            let earlyHtml = "";
            let midHtml = "";
            let lateHtml = "";
            const hasMidShiftInDay = shiftData["午班"].length > 0;

            if (currentEmployeeFilter === "all") {
                earlyHtml = shiftData["早班"].length
                    ? shiftData["早班"].map(person => renderDetailPerson(person, "早班")).join("")
                    : `<span class="text-gray-400 text-xs font-normal">無班</span>`;
                midHtml = shiftData["午班"].length
                    ? shiftData["午班"].map(person => renderDetailPerson(person, "午班")).join("")
                    : `<span class="text-gray-400 text-xs font-normal">無班</span>`;
                lateHtml = shiftData["晚班"].length
                    ? shiftData["晚班"].map(person => renderDetailPerson(person, "晚班")).join("")
                    : `<span class="text-gray-400 text-xs font-normal">無班</span>`;
            } else {
                titleText = `<span class="text-[#1A1D20]">${currentMonth}月${day}日</span> <span class="text-amber-600 ml-1 font-black">${escapeHtml(currentEmployeeFilter)} 專屬班表</span>`;
                const myEarly = shiftData["早班"].find(employee => employee.name === currentEmployeeFilter);
                const myMid = shiftData["午班"].find(employee => employee.name === currentEmployeeFilter);
                const myLate = shiftData["晚班"].find(employee => employee.name === currentEmployeeFilter);
                const otherEarly = shiftData["早班"].filter(employee => employee.name !== currentEmployeeFilter).map(employee => employee.name);
                const otherMid = shiftData["午班"].filter(employee => employee.name !== currentEmployeeFilter).map(employee => employee.name);
                const otherLate = shiftData["晚班"].filter(employee => employee.name !== currentEmployeeFilter).map(employee => employee.name);

                earlyHtml = myEarly
                    ? renderDetailPerson(myEarly, "早班")
                    : `<p class="text-sm font-bold text-gray-400">休假 🏖️</p>`;
                if (otherEarly.length) earlyHtml += `<div class="mt-2 pt-1.5 border-t border-amber-100"><p class="text-[10px] text-gray-400 font-medium">搭檔：${otherEarly.map(escapeHtml).join("、")}</p></div>`;

                midHtml = myMid
                    ? renderDetailPerson(myMid, "午班")
                    : `<p class="text-sm font-bold text-gray-400">休假 🏖️</p>`;
                if (otherMid.length) midHtml += `<div class="mt-2 pt-1.5 border-t border-green-100"><p class="text-[10px] text-gray-400 font-medium">搭檔：${otherMid.map(escapeHtml).join("、")}</p></div>`;

                lateHtml = myLate
                    ? renderDetailPerson(myLate, "晚班")
                    : `<p class="text-sm font-bold text-gray-400">休假 🏖️</p>`;
                if (otherLate.length) lateHtml += `<div class="mt-2 pt-1.5 border-t border-blue-100"><p class="text-[10px] text-gray-400 font-medium">搭檔：${otherLate.map(escapeHtml).join("、")}</p></div>`;
            }

            const containerClass = hasMidShiftInDay ? "flex flex-col gap-3" : "flex gap-3";
            const midCardHtml = hasMidShiftInDay ? `
                <div class="flex-1 bg-[#F0FFF4] rounded-xl p-3 border border-green-100 flex flex-col">
                    <div class="flex items-center gap-1.5 mb-2">
                        <i class="fa-solid fa-mug-hot text-emerald-500 text-sm"></i>
                        <span class="text-xs font-bold text-gray-500">午班 13:30 - 17:00</span>
                    </div>
                    <div class="flex-1">${midHtml}</div>
                </div>` : "";

            detailContainer.innerHTML = `
                <div class="calendar-detail-card bg-white rounded-2xl border border-[#E2E8F0] p-4 shadow-sm animate-fade-in">
                    <div class="flex justify-between items-center mb-3 gap-2">
                        <span class="text-base font-black text-[#1A1D20]">${titleText}</span>
                        <span class="text-[10px] font-bold bg-gray-100 text-gray-500 px-2 py-0.5 rounded shrink-0">${getWeekdayString(currentMonth, day)}</span>
                    </div>
                    <hr class="border-[#EDF2F7] mb-3">
                    <div class="${containerClass}">
                        <div class="flex-1 bg-[#FFFDF5] rounded-xl p-3 border border-amber-100 flex flex-col min-w-0">
                            <div class="flex items-center gap-1.5 mb-2">
                                <i class="fa-solid fa-sun text-amber-500 text-sm"></i>
                                <span class="text-[11px] font-bold text-gray-500">早班 ${getMorningShiftHours(currentMonth, day)}</span>
                            </div>
                            <div class="flex-1">${earlyHtml}</div>
                        </div>
                        ${midCardHtml}
                        <div class="flex-1 bg-[#F0F7FF] rounded-xl p-3 border border-blue-100 flex flex-col min-w-0">
                            <div class="flex items-center gap-1.5 mb-2">
                                <i class="fa-solid fa-moon text-indigo-500 text-sm"></i>
                                <span class="text-xs font-bold text-gray-500">晚班</span>
                            </div>
                            <div class="flex-1">${lateHtml}</div>
                        </div>
                    </div>
                </div>`;
        }

        function renderSummaryPage() {
            const container = document.getElementById("employee-summary-list");
            container.innerHTML = "";
            const statsData = appData[currentMonth].stats;

            if (!statsData || statsData.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-400 text-center py-10">本月份尚無統計資料</p>`;
                return;
            }

            statsData.forEach(emp => {
                let chipsHtml = "";
                if (emp.holidayWorkDays && emp.holidayWorkDays.length > 0) chipsHtml += makeChips("休假日出勤", emp.holidayWorkDays, "bg-sky-50 border-sky-200 text-sky-600");
                chipsHtml += makeChips("休假日", emp.fullLeaves, "bg-gray-50 border-gray-200 text-gray-600");
                if(emp.morningLeaves && emp.morningLeaves.length > 0) chipsHtml += makeChips("早班休", emp.morningLeaves, "bg-amber-50 border-amber-100 text-amber-600");
                if(emp.midLeaves && emp.midLeaves.length > 0) chipsHtml += makeChips("午班休", emp.midLeaves, "bg-green-50 border-green-100 text-green-600");
                if(emp.eveningLeaves && emp.eveningLeaves.length > 0) chipsHtml += makeChips("晚班休", emp.eveningLeaves, "bg-blue-50 border-blue-100 text-blue-600");

                container.innerHTML += `
                    <div class="summary-card reveal-pop bg-white rounded-2xl border border-[#E2E8F0] p-4 shadow-sm">
                        <div class="flex items-center mb-3">
                            <span class="text-base font-black text-[#1A1D20]">${emp.name}</span>
                        </div>
                        <hr class="border-[#EDF2F7] mb-3">
                        <div class="flex flex-col gap-3">${chipsHtml}</div>
                    </div>
                `;
            });
            applyStaggerAnimation(".summary-card", 55);
        }

        function makeChips(title, days, colorClass) {
            if (!days || days.length === 0) return "";
            const items = days.map(day => `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold border ${colorClass}">${day}號</span>`).join("");
            const textClass = colorClass.split(/\s+/).find(className => className.startsWith("text-")) || "text-gray-500";
            const dotClass = textClass.replace(/^text-/, "bg-");
            return `
                <div>
                    <div class="text-[11px] font-bold text-gray-400 mb-1.5 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full ${dotClass}"></span>
                        ${escapeHtml(title)} (共 ${days.length} 天)
                    </div>
                    <div class="flex flex-wrap gap-1.5">${items}</div>
                </div>
            `;
        }

        function switchPage(page) {
            if (navigator.vibrate) navigator.vibrate(30);

            document.getElementById("page-daily").classList.add("hidden");
            document.getElementById("page-calendar").classList.add("hidden");
            document.getElementById("page-summary").classList.add("hidden");
            
            ["nav-calendar", "nav-daily", "nav-summary"].forEach(id => {
                const navButton = document.getElementById(id);
                navButton.classList.remove("active");
                navButton.removeAttribute("aria-current");
            });

            if (page === 'daily') {
                document.getElementById("page-daily").classList.remove("hidden");
                document.getElementById("nav-daily").classList.add("active");
                document.getElementById("nav-daily").setAttribute("aria-current", "page");
                dayInitiated = false;
                renderDailyPage(currentSelectedDay);
            } else if (page === 'calendar') {
                document.getElementById("page-calendar").classList.remove("hidden");
                document.getElementById("nav-calendar").classList.add("active");
                document.getElementById("nav-calendar").setAttribute("aria-current", "page");
                renderCalendarPage();
            } else if (page === 'summary') {
                document.getElementById("page-summary").classList.remove("hidden");
                document.getElementById("nav-summary").classList.add("active");
                document.getElementById("nav-summary").setAttribute("aria-current", "page");
                renderSummaryPage();
            }
        }

        // ===== 即時氣象：固定診所所在地，避免跳出定位確認 =====
        const defaultWeatherLocation = { latitude: 23.0109, longitude: 120.2053, label: "台南北區" };
        let activeWeatherLocation = { ...defaultWeatherLocation };

        function getUserPosition() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error("此裝置不支援定位"));
                    return;
                }
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: false,
                    timeout: 8000,
                    maximumAge: 30 * 60 * 1000
                });
            });
        }

        async function reverseGeocode(latitude, longitude) {
            try {
                const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=zh`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("地區查詢失敗");
                const data = await response.json();
                const label = data.locality || data.city || data.principalSubdivision || "目前位置";
                return String(label).replace("臺灣省", "").replace("台灣省", "").trim() || "目前位置";
            } catch (error) {
                return "目前位置";
            }
        }

        function setWeatherAdvice(message, iconClass = "fa-shirt", tone = "sky") {
            const advice = document.getElementById("weather-advice");
            const icon = document.getElementById("weather-advice-icon");
            const text = document.getElementById("weather-advice-text");
            if (!advice || !icon || !text) return;

            const toneMap = {
                sky: {
                    box: "border-sky-100 from-white via-sky-50/80 to-indigo-50/70",
                    icon: "border-sky-100 text-sky-500"
                },
                amber: {
                    box: "border-amber-100 from-white via-amber-50/80 to-orange-50/70",
                    icon: "border-amber-100 text-amber-500"
                },
                rose: {
                    box: "border-rose-100 from-white via-rose-50/80 to-orange-50/70",
                    icon: "border-rose-100 text-rose-500"
                },
                slate: {
                    box: "border-slate-200 from-white via-slate-50/90 to-gray-100/80",
                    icon: "border-slate-200 text-slate-500"
                }
            };

            const allBoxClasses = Object.values(toneMap).flatMap(item => item.box.split(" "));
            const allIconClasses = Object.values(toneMap).flatMap(item => item.icon.split(" "));
            advice.classList.remove(...allBoxClasses);
            icon.classList.remove(...allIconClasses);

            const selected = toneMap[tone] || toneMap.sky;
            advice.classList.add(...selected.box.split(" "));
            icon.classList.add(...selected.icon.split(" "));
            icon.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
            icon.classList.remove("advice-icon-pop");
            void icon.offsetWidth;
            icon.classList.add("advice-icon-pop");
            text.textContent = message;
        }

        function buildWeatherAdvice({ code, temp, apparentTemp, precipitation, rain, windSpeed, rainProbability, dailyRain }) {
            const isThunderstorm = code >= 95;
            const isFog = code >= 45 && code <= 48;
            const isRain = (code >= 51 && code <= 67) || (code >= 80 && code <= 82);
            const isHeavyRain = [65, 67, 82].includes(code) || precipitation >= 7.5 || rain >= 7.5 || dailyRain >= 30;
            const isLikelyRain = isRain || rainProbability >= 60;
            const isWindy = windSpeed >= 30;

            if (isThunderstorm) {
                return {
                    message: "今天有雷雨風險：建議防水外套＋防滑包鞋，雨具帶好；通勤別搶快，騎車請特別小心。",
                    iconClass: "fa-cloud-bolt",
                    tone: "rose"
                };
            }
            if (isHeavyRain) {
                return {
                    message: "今天雨勢偏大：穿防水外套、快乾長褲與防滑鞋，雨傘抓牢；積水路段慢慢走。",
                    iconClass: "fa-cloud-showers-heavy",
                    tone: "rose"
                };
            }
            if (isLikelyRain) {
                return {
                    message: "今天可能下雨：輕薄防水外套＋防滑鞋最穩，折傘記得帶，襪子也可以多備一雙。",
                    iconClass: "fa-umbrella",
                    tone: "sky"
                };
            }
            if (isFog) {
                return {
                    message: "今天能見度較低：建議穿亮色上衣或外套，騎車開燈、放慢速度，安全感直接拉滿。",
                    iconClass: "fa-smog",
                    tone: "slate"
                };
            }
            if (isWindy) {
                return {
                    message: "今天風勢較強：外套選貼身防風款，帽子先收好；騎車與過路口要留意側風。",
                    iconClass: "fa-wind",
                    tone: "slate"
                };
            }
            if (apparentTemp >= 33 || temp >= 32) {
                return {
                    message: "今天體感炎熱：穿透氣短袖、輕薄長褲，記得補水與防曬；冷氣房可備薄外套。",
                    iconClass: "fa-temperature-high",
                    tone: "amber"
                };
            }
            if (apparentTemp <= 18 || temp <= 18) {
                return {
                    message: "今天偏涼：建議薄外套＋長褲，早晚通勤注意保暖，洋蔥式穿法最不容易翻車。",
                    iconClass: "fa-vest",
                    tone: "slate"
                };
            }
            if (apparentTemp <= 24 || temp <= 24) {
                return {
                    message: "今天舒適偏涼：短袖搭薄外套剛剛好，室內冷氣強的同事記得多帶一件。",
                    iconClass: "fa-shirt",
                    tone: "sky"
                };
            }
            return {
                message: "今天適合輕便上班裝：透氣上衣＋舒適鞋款，通勤補水、防曬，就能漂亮開工。",
                iconClass: "fa-person-walking",
                tone: "sky"
            };
        }

        async function initWeather() {
            const widget = document.getElementById("weather-widget");
            widget.innerHTML = `<i class="fa-solid fa-cloud-sun fa-spin text-sky-500"></i><span class="text-xs truncate">讀取天氣</span>`;
            activeWeatherLocation = { ...defaultWeatherLocation };
            await fetchWeather();
        }

        async function fetchWeather() {
            const widget = document.getElementById("weather-widget");
            try {
                const { latitude, longitude, label } = activeWeatherLocation;
                const currentFields = "temperature_2m,apparent_temperature,precipitation,rain,weather_code,wind_speed_10m";
                const dailyFields = "weather_code,precipitation_probability_max,precipitation_sum";
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=${currentFields}&daily=${dailyFields}&forecast_days=1&timezone=auto`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("氣象讀取失敗");
                const data = await response.json();
                const temp = Math.round(data.current.temperature_2m);
                const apparentTemp = Math.round(data.current.apparent_temperature ?? data.current.temperature_2m);
                const code = Number(data.current.weather_code ?? data.daily?.weather_code?.[0] ?? 3);
                const precipitation = Number(data.current.precipitation ?? 0);
                const rain = Number(data.current.rain ?? 0);
                const windSpeed = Number(data.current.wind_speed_10m ?? 0);
                const rainProbability = Number(data.daily?.precipitation_probability_max?.[0] ?? 0);
                const dailyRain = Number(data.daily?.precipitation_sum?.[0] ?? 0);

                let icon = "☁️";
                if (code === 0) icon = "☀️";
                else if (code >= 1 && code <= 3) icon = "⛅";
                else if (code >= 45 && code <= 48) icon = "🌫️";
                else if (code >= 51 && code <= 67) icon = "🌧️";
                else if (code >= 71 && code <= 77) icon = "❄️";
                else if (code >= 80 && code <= 82) icon = "🌦️";
                else if (code >= 95) icon = "⛈️";

                const animationClass = weatherAnimationClass(code);
                widget.innerHTML = `
                    <span class="weather-emoji ${animationClass} text-base leading-none">${icon}</span>
                    <span class="text-sm font-black text-[#1A1D20] whitespace-nowrap">${temp}°C</span>
                    <span class="flex items-center gap-1 text-[10px] text-gray-500 min-w-0">
                        <i class="fa-solid fa-location-dot text-rose-400 shrink-0"></i>
                        <span class="truncate">${escapeHtml(label)}</span>
                    </span>`;
                widget.title = `${label}｜${temp}°C｜體感 ${apparentTemp}°C｜降雨機率 ${rainProbability}%`;

                const advice = buildWeatherAdvice({
                    code,
                    temp,
                    apparentTemp,
                    precipitation,
                    rain,
                    windSpeed,
                    rainProbability,
                    dailyRain
                });
                setWeatherAdvice(advice.message, advice.iconClass, advice.tone);
            } catch (error) {
                widget.innerHTML = `<span class="weather-emoji cloudy text-base">☁️</span><span class="text-sm font-black">--°C</span><span class="text-[10px] text-gray-400 truncate">${escapeHtml(activeWeatherLocation.label)}</span>`;
                setWeatherAdvice("暫時讀不到即時天氣，先採洋蔥式穿法並隨身帶傘，通勤最保險。", "fa-layer-group", "slate");
            }
        }

        // ===== 自動檢查新版：同一個網址不必重新加入主畫面 =====
        let lastUpdateCheckAt = 0;
        async function checkForAppUpdate() {
            if (window.location.protocol === "file:") return;

            const now = Date.now();
            if (now - lastUpdateCheckAt < 15000) return;
            lastUpdateCheckAt = now;

            try {
                const response = await fetch(`./index.html?update_check=${now}`, {
                    cache: "no-store",
                    headers: { "Cache-Control": "no-cache" }
                });
                if (!response.ok) return;

                const latestHtml = await response.text();
                const versionMatch = latestHtml.match(/<meta\s+name=["']application-version["']\s+content=["']([^"']+)["']/i);
                const latestVersion = versionMatch?.[1];

                if (latestVersion && latestVersion !== APP_VERSION) {
                    const nextUrl = new URL(window.location.href);
                    nextUrl.searchParams.set("v", latestVersion.replace(/[^a-zA-Z0-9._-]/g, ""));
                    nextUrl.searchParams.delete("update_check");
                    window.location.replace(nextUrl.toString());
                }
            } catch (error) {
                console.debug("新版檢查暫時失敗，稍後會再試。", error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.info(`[大北門讚 SmartShift] APP_VERSION: ${APP_VERSION}`);
            const globalMonthSelect = document.getElementById("global-month");
            if (globalMonthSelect) {
                globalMonthSelect.value = currentMonth;
            }
            document.getElementById("calendar-title-month").innerText = `${currentMonth}月 班表日曆`;
            document.getElementById("summary-title-month").innerText = `${currentMonth}月 休假總覽`;

            initEmployeeFilter();
            renderDailyPage(currentSelectedDay);

            // 啟動定位與氣象服務
            initWeather();
            // 每 30 分鐘更新一次氣象（不重複要求定位權限）
            setInterval(fetchWeather, 30 * 60 * 1000);

            // 每 10 分鐘、以及重新回到 APP 時，自動檢查 GitHub Pages 是否有新版
            checkForAppUpdate();
            setInterval(checkForAppUpdate, 10 * 60 * 1000);
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden) checkForAppUpdate();
            });
            window.addEventListener("pageshow", checkForAppUpdate);

            // 🌟 啟動心跳神經：每 1 分鐘自動檢查是否到了下班時間
            setInterval(() => {
                updateSmartStatus(currentSelectedDay);
            }, 60000); 
        });

    </script>
